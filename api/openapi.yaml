openapi: 3.1.0
info:
  title: HD Platform API
  description: Human Design chart computation and transit analysis API
  license:
    name: AGPLv3
    url: https://www.gnu.org/licenses/agpl-3.0.html
  version: 0.1.0
paths:
  /v1/natal:
    post:
      tags:
      - natal
      summary: Natal Chart
      description: 'Compute a natal (birth) chart.


        Requires a valid **X-API-Key** header.'
      operationId: natal_chart_v1_natal_post
      parameters:
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NatalRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NatalResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/natal/noauth:
    post:
      tags:
      - natal
      summary: Natal Chart Noauth
      description: Test endpoint — no API key required.
      operationId: natal_chart_noauth_v1_natal_noauth_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NatalRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NatalResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/transits:
    post:
      tags:
      - transits
      summary: Transit Chart
      description: 'Compute a transit overlay for a natal chart.


        Requires a valid **X-API-Key** header.  Pass an optional

        *target_date* to override the snapshot date; otherwise the

        current date is used.'
      operationId: transit_chart_v1_transits_post
      parameters:
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/bodygraph:
    post:
      tags:
      - bodygraph
      summary: Bodygraph
      operationId: bodygraph_v1_bodygraph_post
      parameters:
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodygraphRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodygraphResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/bodygraph/noauth:
    post:
      tags:
      - bodygraph
      summary: Bodygraph Noauth
      operationId: bodygraph_noauth_v1_bodygraph_noauth_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodygraphRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodygraphResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ping:
    get:
      tags:
      - health
      summary: Ping
      description: Simple liveness / readiness probe.
      operationId: ping_ping_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ping Ping Get
components:
  schemas:
    BodygraphRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        year:
          type: integer
          maximum: 2100.0
          minimum: 1900.0
          title: Year
        month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Month
        day:
          type: integer
          maximum: 31.0
          minimum: 1.0
          title: Day
        hour:
          type: integer
          maximum: 23.0
          minimum: 0.0
          title: Hour
        minute:
          type: integer
          maximum: 59.0
          minimum: 0.0
          title: Minute
          default: 0
        location:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Location
        lat:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Lat
        lon:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          title: Lon
        timezone:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Timezone
      type: object
      required:
      - name
      - year
      - month
      - day
      - hour
      title: BodygraphRequest
    BodygraphResponse:
      properties:
        success:
          type: boolean
          title: Success
        endpoint:
          type: string
          title: Endpoint
          default: /v1/bodygraph
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - success
      title: BodygraphResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    NatalRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          description: Person or entity name
        year:
          type: integer
          maximum: 2100.0
          minimum: 1900.0
          title: Year
          description: Birth year
        month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Month
          description: Birth month (1–12)
        day:
          type: integer
          maximum: 31.0
          minimum: 1.0
          title: Day
          description: Birth day (1–31)
        hour:
          type: integer
          maximum: 23.0
          minimum: 0.0
          title: Hour
          description: Birth hour (0–23)
        minute:
          type: integer
          maximum: 59.0
          minimum: 0.0
          title: Minute
          description: Birth minute (0–59)
          default: 0
        location:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Location
          description: Place name
        lat:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Lat
          description: Latitude
        lon:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          title: Lon
          description: Longitude
        timezone:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Timezone
          description: IANA timezone
      type: object
      required:
      - name
      - year
      - month
      - day
      - hour
      title: NatalRequest
      description: Validated body for a natal chart calculation.
    NatalResponse:
      properties:
        success:
          type: boolean
          title: Success
        endpoint:
          type: string
          title: Endpoint
          default: /v1/natal
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - success
      title: NatalResponse
      description: Standard API wrapper for natal chart responses.
    TransitsRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          description: Person or entity name
        year:
          type: integer
          maximum: 2100.0
          minimum: 1900.0
          title: Year
          description: Birth year
        month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Month
          description: Birth month (1–12)
        day:
          type: integer
          maximum: 31.0
          minimum: 1.0
          title: Day
          description: Birth day (1–31)
        hour:
          type: integer
          maximum: 23.0
          minimum: 0.0
          title: Hour
          description: Birth hour (0–23)
        minute:
          type: integer
          maximum: 59.0
          minimum: 0.0
          title: Minute
          description: Birth minute (0–59)
          default: 0
        location:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Location
          description: Place name
        lat:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Lat
          description: Latitude
        lon:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          title: Lon
          description: Longitude
        timezone:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Timezone
          description: IANA timezone
        target_date:
          anyOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          - type: 'null'
          title: Target Date
          description: 'Snapshot date in YYYY-MM-DD format (default: today)'
      type: object
      required:
      - name
      - year
      - month
      - day
      - hour
      title: TransitsRequest
      description: Validated body for a transit chart calculation.
    TransitsResponse:
      properties:
        success:
          type: boolean
          title: Success
        endpoint:
          type: string
          title: Endpoint
          default: /v1/transits
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - success
      title: TransitsResponse
      description: Standard API wrapper for transit overlay responses.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
