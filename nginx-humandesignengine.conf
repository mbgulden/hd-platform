# HDE Nginx Config — humandesignengine.com
# Place at /etc/nginx/sites-available/humandesignengine
# Then: ln -s /etc/nginx/sites-available/humandesignengine /etc/nginx/sites-enabled/
# SSL: certbot --nginx -d humandesignengine.com -d api.humandesignengine.com
# 
# BLOCKED: DNS must point to this server before SSL can be provisioned.
# humandesignengine.com currently routes through tunnel e48d6f7b.

server {
    listen 80;
    server_name humandesignengine.com www.humandesignengine.com;

    # Static landing page / marketing site
    location / {
        proxy_pass http://localhost:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SEO content (gate pages, channel pages, etc.)
    location /gates/ { proxy_pass http://localhost:8090; }
    location /channels/ { proxy_pass http://localhost:8090; }
    location /centers/ { proxy_pass http://localhost:8090; }

    # Buy report page
    location /buy-report.html { proxy_pass http://localhost:8090; }
}

server {
    listen 80;
    server_name api.humandesignengine.com;

    # HD API (natal charts, transits, synastry)
    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# SSL will be added by certbot after DNS is configured
